<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Form Surat Keterangan Pindah Sekolah - MI Salafiyatul Ma'muroh</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.49.0/build/docxtemplater.js"></script>
<style>
:root{ --primary:#0f5132; --primary-light:#198754; --accent:#FFC107; --bg:#FFFBF5; --card:#ffffff; --muted:#6b7280; --border:#f0f0f0; }
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}
body{background:var(--bg);color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--primary);font-size:1.05rem;text-decoration:none}
.logo img{width:36px;height:36px;object-fit:contain;border-radius:6px}
.nav-links a{margin-left:18px;text-decoration:none;color:#1a1a1a;font-weight:600;font-size:.85rem}
.nav-links a.cbt{background:var(--primary);color:white;padding:8px 14px;border-radius:8px;border:1px solid var(--primary)}
.header-card{max-width:600px;width:90%;margin:28px auto 0;background:linear-gradient(135deg,#0f5132,#198754);border-radius:22px;padding:26px 24px;color:white;text-align:center;box-shadow:0 18px 36px rgba(15,81,50,.18);position:relative;overflow:hidden}
.header-card::after{content:"";position:absolute;right:-20px;top:-20px;width:100px;height:100px;background:rgba(255,255,255,.12);border-radius:50%}
.header-card h1{font-size:1.4rem;font-weight:800;margin-bottom:4px;position:relative;z-index:1;line-height:1.3}
.header-card p{font-size:.88rem;color:rgba(255,255,255,.9);position:relative;z-index:1}
.container{flex:1;max-width:600px;width:90%;margin:20px auto 0;background:var(--card);padding:26px 22px;border-radius:18px;border:1px solid var(--border);box-shadow:0 10px 24px rgba(0,0,0,.05)}
.form-group{margin-bottom:16px}
label{display:block;font-weight:700;margin-bottom:6px;color:var(--primary);font-size:.86rem}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-family:Poppins,sans-serif;font-size:.9rem;background:#fff;transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(25,135,84,.12)}
.btn-submit{background:linear-gradient(135deg,#0f5132,#198754);color:white;border:none;padding:13px;width:100%;border-radius:11px;font-weight:700;cursor:pointer;font-size:.95rem;transition:.2s;box-shadow:0 8px 18px rgba(15,81,50,.2)}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 12px 22px rgba(15,81,50,.28)}
.back-container{text-align:center;margin:22px 0 36px}
.btn-back{display:inline-block;background:white;border:1.5px solid var(--border);color:var(--muted);padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600;font-size:.85rem}
.btn-back:hover{border-color:var(--primary);color:var(--primary)}
footer{background:#111;color:#aaa;text-align:center;padding:22px;font-size:.85rem;margin-top:auto;line-height:1.6}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .6s ease forwards}
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html"><img src="logo-mi.png" alt="Logo MI"> MI Salafiyatul Ma'muroh Paesan</a>
  <div class="nav-links"><a href="pilih-surat.html">Layanan Surat</a><a class="cbt" href="index.html">Beranda</a></div>
</nav>

<div class="header-card fade">
  <h1>🚚 Form Surat Keterangan Pindah Sekolah</h1>
  <p>Lengkapi data siswa yang akan pindah</p>
</div>

<div class="container fade" style="animation-delay:.08s">
  <form id="pindahForm">
    <div class="form-group">
      <label>Tanggal Surat</label>
      <input type="date" id="tanggal_input" required>
    </div>
    <div class="form-group">
      <label>Nama Siswa</label>
      <input type="text" id="nama-siswa" required placeholder="Nama lengkap siswa">
    </div>
    <div class="form-group">
      <label>NISN</label>
      <input type="text" id="nisn" required placeholder="Nomor Induk Siswa Nasional">
    </div>
    <div class="form-group">
      <label>Jenis Kelamin</label>
      <select id="kelamin" required>
        <option value="" disabled selected>Pilih Jenis Kelamin</option>
        <option value="Laki-laki">Laki-laki</option>
        <option value="Perempuan">Perempuan</option>
      </select>
    </div>
    <div class="form-group">
      <label>Kelas</label>
      <select id="kelas" required>
        <option value="" disabled selected>Pilih Kelas</option>
        <option value="I (Satu)">I (Satu)</option>
        <option value="II (Dua)">II (Dua)</option>
        <option value="III (Tiga)">III (Tiga)</option>
        <option value="IV (Empat)">IV (Empat)</option>
        <option value="V (Lima)">V (Lima)</option>
        <option value="VI (Enam)">VI (Enam)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Nama Orang Tua / Wali</label>
      <input type="text" id="nama-orang-tua" required placeholder="Nama orang tua/wali murid">
    </div>
    <div class="form-group">
      <label>Pekerjaan Orang Tua</label>
      <input type="text" id="pekerjaan-orang-tua" required placeholder="Contoh: Petani / Wiraswasta">
    </div>
    <div class="form-group">
      <label>Sekolah Tujuan</label>
      <input type="text" id="sekolah-tujuan" required placeholder="Nama madrasah/sekolah baru tujuan">
    </div>
    <div class="form-group">
      <label>Alasan Pindah</label>
      <textarea id="alasan-pindah" rows="2" required placeholder="Contoh: Mengikuti kepindahan domisili orang tua"></textarea>
    </div>
    <button type="button" class="btn-submit" onclick="generateDoc()">⬇️ Unduh Surat Pindah (.docx)</button>
  </form>
</div>

<div class="back-container">
  <a href="pilih-surat.html" class="btn-back">← Kembali ke Pilihan Surat</a>
</div>

<footer>
<p>&copy; 2025 MI Salafiyatul Ma'muroh Paesan | Jelok, Cepogo</p>
<p>085725311612 | 081567681930 | mipaesan@gmail.com</p>
</footer>

<script>
function generateDoc() {
  const tanggalVal = document.getElementById('tanggal_input').value;
  if (!tanggalVal) {
    alert('Mohon pilih tanggal surat terlebih dahulu!');
    return;
  }
  const d = new Date(tanggalVal);
  const tahun = d.getFullYear();
  const monthIndex = d.getMonth();
  const day = d.getDate();
  const romanMonths = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  const bulanRomawi = romanMonths[monthIndex];
  const indoMonths = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  const tanggalSuratFormatted = `${day} ${indoMonths[monthIndex]} ${tahun}`;
  const formData = {
    'bulan-romawi': bulanRomawi,
    'tahun': tahun.toString(),
    'tanggal-surat': tanggalSuratFormatted,
    'nama-siswa': document.getElementById('nama-siswa').value,
    'nisn': document.getElementById('nisn').value,
    'kelamin': document.getElementById('kelamin').value,
    'kelas': document.getElementById('kelas').value,
    'nama-orang-tua': document.getElementById('nama-orang-tua').value,
    'pekerjaan-orang-tua': document.getElementById('pekerjaan-orang-tua').value,
    'sekolah-tujuan': document.getElementById('sekolah-tujuan').value,
    'alasan-pindah': document.getElementById('alasan-pindah').value
  };
  fetch('template/template-surat-pindah.docx')
    .then(res => { if(!res.ok) throw new Error("Template surat pindah tidak ditemukan di dalam folder template"); return res.arrayBuffer(); })
    .then(content => {
      const zip = new PizZip(content);
      const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
      doc.render(formData);
      const out = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(out);
      link.download = `Surat_Pindah_${formData['nama-siswa'].replace(/\s+/g, '_')}.docx`;
      link.click();
    })
    .catch(err => alert('Gagal: ' + err.message));
}
</script>
</body>
</html>
