<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Jenis Surat - MI Salafiyatul Ma’muroh</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', sans-serif; background: #f8f9fa; color: #333; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; }
    .container { max-width: 500px; width: 90%; background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
    h1 { font-size: 1.8em; color: #1e7e34; margin-bottom: 10px; }
    p { color: #666; margin-bottom: 30px; }
    .menu-list { display: flex; flex-direction: column; gap: 15px; }
    
    /* Tombol dengan warna berbeda-beda untuk tiap surat */
    .btn-surat { display: block; text-decoration: none; padding: 16px; border-radius: 8px; font-weight: 600; color: white; font-size: 1.05em; transition: opacity 0.2s, transform 0.1s; }
    .btn-surat:hover { opacity: 0.9; transform: translateY(-2px); }
    
    .btn-tugas { background-color: #1e7e34; }       /* Hijau */
    .btn-pindah { background-color: #007bff; }      /* Biru */
    .btn-undangan { background-color: #d97706; }    /* Oranye */
    .btn-ket-guru { background-color: #4f46e5; }    /* Ungu / Indigo */
    .btn-ket-siswa { background-color: #0284c7; }   /* Biru Laut */
    
    .footer-back { margin-top: 25px; }
    .footer-back a { color: #666; text-decoration: none; font-size: 0.9em; }
    .footer-back a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Pilih Layanan Surat</h1>
    <p>Silakan pilih jenis surat yang ingin Anda buat</p>
    
    <div class="menu-list">
      <a href="form-surat-tugas.html" class="btn-surat btn-tugas">Surat Tugas</a>
      <a href="form-surat-pindah.html" class="btn-surat btn-pindah">Surat Keterangan Pindah Sekolah</a>
      <a href="form-surat-undangan.html" class="btn-surat btn-undangan">Surat Undangan Wali Siswa</a>
      <a href="form-surat-keterangan-guru.html" class="btn-surat btn-ket-guru">Surat Keterangan Guru</a>
      <a href="form-surat-keterangan-siswa.html" class="btn-surat btn-ket-siswa">Surat Keterangan Siswa</a>
    </div>

    <div class="footer-back">
      <a href="index.html">&larr; Kembali ke Beranda Utama</a>
    </div>
  </div>

</body>
</html>
