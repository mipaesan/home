<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - CBT MI Salafiyatul Ma'muroh</title>
    <style>
        :root {
            --primary: #0f5132;
            --primary-light: #198754;
            --accent: #ffc107;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #dee2e6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 30px; }

        header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 1.2rem 1rem; text-align: center; }
        header h1 { font-size: 1.4rem; }

        .container { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 10px; padding: 1.25rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
        .form-control { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; }

        .btn { padding: 0.6rem 1.2rem; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-warning { background: var(--accent); color: #212529; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
        th, td { border: 1px solid var(--border); padding: 0.75rem; text-align: left; }
        th { background: #e9ecef; color: var(--primary); }

        .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 999; align-items: center; justify-content: center; padding: 1rem; }
        .modal-card { background: white; border-radius: 12px; max-width: 650px; width: 100%; padding: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <h1>DASHBOARD GURU & KOREKSI CBT</h1>
        <p>MI Salafiyatul Ma'muroh</p>
    </header>

    <div class="container">
        <!-- LOGIN GURU -->
        <div id="login-guru-section" class="card" style="max-width: 400px; margin: 3rem auto;">
            <div class="card-title">Login Guru</div>
            <form onsubmit="event.preventDefault(); prosesLoginGuru();">
                <div class="form-group">
                    <label>ID Guru</label>
                    <input type="text" id="input-id-guru" class="form-control" placeholder="Contoh: G-001" required>
                </div>
                <div class="form-group">
                    <label>Password / PIN</label>
                    <input type="password" id="input-pin-guru" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">MASUK DASHBOARD</button>
            </form>
        </div>

        <!-- DASHBOARD UTAMA -->
        <div id="dashboard-section" style="display: none;">
            <div class="card">
                <div class="card-title">
                    <span>Selamat Datang, <strong id="guru-nama">-</strong></span>
                    <button class="btn btn-warning" onclick="location.reload()" style="font-size:0.8rem;">Keluar</button>
                </div>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end;">
                    <div class="form-group" style="flex: 1; min-width: 220px; margin-bottom:0;">
                        <label>Pilih Mata Pelajaran</label>
                        <select id="select-mapel-rekap" class="form-control">
                            <option value="">-- Loading Mapel --</option>
                        </select>
                    </div>
                    <button class="btn" onclick="muatDataRekap()">Tampilkan Rekap Nilai</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Rekap Nilai Siswa</div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>NIS</th>
                                <th>Nama Siswa</th>
                                <th>Nilai PG</th>
                                <th>Nilai Essay</th>
                                <th>Total Nilai</th>
                                <th>Aksi Koreksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-rekap-body">
                            <tr><td colspan="7" style="text-align: center; color: #6c757d;">Pilih mapel untuk menampilkan rekap.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL & INPUT KOREKSI -->
    <div id="modal-koreksi" class="modal-overlay">
        <div class="modal-card">
            <div class="card-title">
                <span>Koreksi & Detail Jawaban</span>
                <button onclick="tutupModalKoreksi()" style="border:none; background:none; font-size:1.2rem; cursor:pointer;">✕</button>
            </div>
            
            <p style="font-size:0.9rem; margin-bottom:0.5rem;">Siswa: <strong id="modal-siswa-nama">-</strong> (<span id="modal-siswa-nis">-</span>)</p>

            <div id="detail-jawaban-content" style="max-height:250px; overflow-y:auto; font-size:0.88rem; line-height:1.5; border:1px solid #dee2e6; padding:0.8rem; border-radius:6px; background:#f8f9fa;">
                Loading...
            </div>

            <hr style="margin:1rem 0; border:0; border-top:1px solid #dee2e6;">

            <!-- FORM INPUT NILAI ESSAY OLEH GURU -->
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                <div class="form-group">
                    <label>Nilai Isian / Uraian (0 - 100):</label>
                    <input type="number" id="input-nilai-essay" class="form-control" placeholder="Misal: 80" min="0" max="100">
                </div>
                <div class="form-group">
                    <label>Catatan Guru (Opsional):</label>
                    <input type="text" id="input-catatan-guru" class="form-control" placeholder="Misal: Bagus, tingkatkan lagi">
                </div>
            </div>

            <div style="margin-top:1rem; text-align:right; display:flex; gap:0.5rem; justify-content:flex-end;">
                <button class="btn" style="background:#6c757d;" onclick="tutupModalKoreksi()">Batal</button>
                <button class="btn btn-warning" onclick="simpanKoreksiGuru()">💾 SIMPAN NILAI KOREKSI</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxxcs96dxFK_IatVI53R2woXXuxKzxhAxtsAvOY7NXb7gF-iTQ3OKbYvtM8meHC5AgYvQ/exec";

        let listMembers = [], currentGuru = null, selectedNIS = null, currentMapelName = null;

        window.onload = async function() {
            try {
                const res = await fetch('members.json'); listMembers = await res.json();
            } catch(e) { alert("Gagal memuat members.json"); }
        };

        function prosesLoginGuru() {
            const idG = document.getElementById('input-id-guru').value.trim();
            const pinG = document.getElementById('input-pin-guru').value.trim();

            const guru = listMembers.find(m => m.id === idG && m.role === 'guru');
            if (!guru || guru.pin !== pinG) return alert("ID Guru atau Password salah!");

            currentGuru = guru;
            document.getElementById('login-guru-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            document.getElementById('guru-nama').textContent = guru.nama;

            loadDaftarMapel();
        }

        async function loadDaftarMapel() {
            const res = await fetch('jadwal.json');
            const jadwal = await res.json();
            const sel = document.getElementById('select-mapel-rekap');
            sel.innerHTML = '<option value="">-- Pilih Mata Pelajaran --</option>';
            jadwal.forEach(j => {
                let opt = document.createElement('option');
                opt.value = j.mapel; opt.textContent = j.mapel;
                sel.appendChild(opt);
            });
        }

        async function muatDataRekap() {
            const mapel = document.getElementById('select-mapel-rekap').value;
            if(!mapel) return alert("Pilih mata pelajaran dulu!");

            currentMapelName = mapel;
            const sheetName = "HASIL_" + mapel.toUpperCase().replace(/[^A-Z0-9_]/g, "_");
            const tbody = document.getElementById('tabel-rekap-body');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Mengambil data dari Google Sheets...</td></tr>';

            try {
                const res = await fetch(`${GAS_WEBAPP_URL}?action=getData&sheet=${encodeURIComponent(sheetName)}`);
                const json = await res.json();

                if(!json.data || json.data.length <= 1) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Belum ada jawaban siswa.</td></tr>';
                    return;
                }

                let html = '';
                for(let i = 1; i < json.data.length; i++) {
                    let row = json.data[i];
                    html += `
                        <tr>
                            <td>${i}</td>
                            <td>${row[1]}</td>
                            <td><strong>${row[2]}</strong></td>
                            <td><span style="color:#0f5132; font-weight:bold;">${row[5]}</span></td>
                            <td><span style="color:#0d6efd; font-weight:bold;">${row[7] || 0}</span></td>
                            <td><span style="color:#dc3545; font-weight:bold; font-size:1.05rem;">${row[8] || row[5]}</span></td>
                            <td>
                                <button class="btn" style="padding:0.3rem 0.6rem; font-size:0.8rem;" onclick='bukaKoreksi("${row[1]}", "${row[2]}", ${JSON.stringify(row[6])}, "${row[7]}", "${row[9]}")'>📝 Koreksi / Detail</button>
                            </td>
                        </tr>
                    `;
                }
                tbody.innerHTML = html;
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Gagal mengambil data.</td></tr>';
            }
        }

        function bukaKoreksi(nis, nama, rawJson, nilaiEssay, catatan) {
            selectedNIS = nis;
            document.getElementById('modal-siswa-nama').textContent = nama;
            document.getElementById('modal-siswa-nis').textContent = nis;
            document.getElementById('input-nilai-essay').value = (nilaiEssay && nilaiEssay !== "-") ? nilaiEssay : "";
            document.getElementById('input-catatan-guru').value = (catatan && catatan !== "-") ? catatan : "";

            try {
                const obj = typeof rawJson === 'string' ? JSON.parse(rawJson) : rawJson;
                let html = '<strong>Pilihan & Jawaban Siswa:</strong><ol style="padding-left:1.2rem; margin-top:0.4rem;">';
                for(let key in obj) {
                    let val = typeof obj[key] === 'object' ? JSON.stringify(obj[key]) : obj[key];
                    html += `<li style="margin-bottom:0.4rem;"><b>Soal No. ${key}:</b> <span style="background:#e9ecef; padding:2px 6px; border-radius:4px;">${val}</span></li>`;
                }
                document.getElementById('detail-jawaban-content').innerHTML = html + '</ol>';
            } catch(e) {
                document.getElementById('detail-jawaban-content').innerHTML = "Jawaban Raw: " + rawJson;
            }

            document.getElementById('modal-koreksi').style.display = 'flex';
        }

        async function simpanKoreksiGuru() {
            const nilaiEssay = document.getElementById('input-nilai-essay').value;
            const catatan = document.getElementById('input-catatan-guru').value;

            if (nilaiEssay === "") return alert("Masukkan nilai isian/uraian terlebih dahulu!");

            const sheetName = "HASIL_" + currentMapelName.toUpperCase().replace(/[^A-Z0-9_]/g, "_");
            const payload = {
                action: "updateNilai",
                sheetName: sheetName,
                nis: selectedNIS,
                nilaiEssay: Number(nilaiEssay),
                catatan: catatan
            };

            alert("⏳ Menyimpan nilai koreksi ke Google Sheets...");

            try {
                await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert("✅ Nilai koreksi berhasil disimpan!");
                tutupModalKoreksi();
                muatDataRekap();
            } catch(e) {
                alert("⚠️ Gagal menyimpan nilai.");
            }
        }

        function tutupModalKoreksi() { document.getElementById('modal-koreksi').style.display = 'none'; }
    </script>
</body>
</html>
