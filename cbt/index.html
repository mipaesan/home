<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Online - MI Salafiyatul Ma'muroh</title>
    <style>
        :root {
            --primary: #0f5132;
            --primary-light: #198754;
            --accent: #ffc107;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #dee2e6;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        /* DILARANG BLOK / SELEKSI TEKS DI SELURUH HALAMAN UJIAN */
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            padding-bottom: 30px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* KOTAK INPUT TETAP BISA DIKETIK SISWA */
        input, textarea {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 1.2rem 1rem; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
        header p { font-size: 0.85rem; opacity: 0.9; }

        .container { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 10px; padding: 1.5rem; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
        .form-control { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }

        .btn { padding: 0.65rem 1.2rem; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; justify-content: center; text-align: center; gap: 6px; }
        .btn:hover { background: var(--primary-light); }
        .btn-warning { background: var(--accent); color: #212529; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: #dc3545; color: white; }

        /* UJIAN AREA */
        #ujian-section { display: none; }
        .top-bar-ujian { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .timer-box { flex: 1; min-width: 180px; background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 0.65rem 1rem; border-radius: 6px; font-weight: bold; text-align: center; font-size: 1.1rem; }
        
        .soal-card { background: #f8f9fa; border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem; margin-bottom: 1.2rem; }
        .soal-teks { font-weight: 600; margin-bottom: 0.8rem; font-size: 1.05rem; }
        .pilihan-item { display: block; background: white; border: 1px solid var(--border); padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 0.5rem; cursor: pointer; transition: 0.2s; }
        .pilihan-item:hover { background: #e9ecef; }
        .pilihan-item input { margin-right: 8px; }

        .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; padding: 1rem; }
        .modal-card { background: white; border-radius: 12px; max-width: 420px; width: 100%; padding: 1.5rem; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }

        .nav-guru-link { text-align: center; margin-top: 1rem; }
        .nav-guru-link a { color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;" onpaste="return false;">

    <header>
        <h1>CBT MI SALAFIYATUL MA'MUROH</h1>
        <p>Portal Ujian Asesmen Siswa Berbasis Komputer</p>
    </header>

    <div class="container">
        <!-- FORM LOGIN SISWA -->
        <div id="login-section" class="card">
            <div class="card-title">Masuk Ruang Ujian</div>
            <form onsubmit="event.preventDefault(); prosesLoginSiswa();">
                <div class="form-group">
                    <label>Nomor Induk Siswa (NIS)</label>
                    <input type="text" id="input-nis" class="form-control" placeholder="Contoh: 12345" required>
                </div>
                <div class="form-group">
                    <label>Token Ujian (Diberikan Pengawas)</label>
                    <input type="text" id="input-token" class="form-control" placeholder="Contoh: SHHRPY" style="text-transform: uppercase;" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">MULAI UJIAN</button>
            </form>
            <div class="nav-guru-link">
                <a href="guru.html">🔐 Masuk ke Dashboard Guru / Koreksi</a>
            </div>
        </div>

        <!-- RUANG UJIAN SISWA -->
        <div id="ujian-section">
            <div class="card" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; background: #e9ecef; margin-bottom: 1rem;">
                <div>Siswa: <strong id="info-nama-siswa">-</strong> (<span id="info-nis-siswa">-</span>)</div>
                <div>Mapel: <strong id="info-mapel-ujian">-</strong></div>
            </div>

            <!-- BARIS ATAS: TIMER & TOMBOL KELUAR -->
            <div class="top-bar-ujian">
                <div class="timer-box">
                    ⏱️ Sisa Waktu: <span id="timer-countdown">00:00:00</span>
                </div>
                <button class="btn btn-danger" onclick="konfirmasiKeluarTanpaSimpan()" style="padding: 0.65rem 1rem; font-size: 0.9rem;">
                    🚪 Keluar Ujian
                </button>
            </div>

            <div id="container-soal">
                <!-- Render soal secara dinamis -->
            </div>

            <button class="btn btn-danger" style="width: 100%; padding: 0.9rem; font-size: 1.1rem; margin-top: 1rem;" onclick="konfirmasiSelesai()">
                SELESAI & KUMPULKAN JAWABAN
            </button>
        </div>
    </div>

    <!-- POPUP NOTIFIKASI -->
    <div id="modal-notif" class="modal-overlay" style="z-index: 1000;">
        <div class="modal-card">
            <div id="notif-icon" style="font-size: 2.5rem; margin-bottom: 0.5rem;">ℹ️</div>
            <h3 id="notif-title" style="color: var(--primary); margin-bottom: 0.5rem;">Informasi</h3>
            <p id="notif-message" style="font-size: 0.95rem; color: #495057; margin-bottom: 1.5rem; line-height: 1.5;"></p>
            <button class="btn" id="notif-btn-ok" style="width: 100%; justify-content: center; text-align: center;">MENGERTI</button>
        </div>
    </div>

    <script>
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxxcs96dxFK_IatVI53R2woXXuxKzxhAxtsAvOY7NXb7gF-iTQ3OKbYvtM8meHC5AgYvQ/exec";

        let listMembers = [], listJadwal = [];
        let currentSiswa = null, currentJadwal = null, activeSoal = [];
        let jawabanSiswa = {};
        let timerInterval = null, sisaDetik = 0;
        let tabSwitchCount = 0;
        const MAX_TAB_SWITCH = 3;

        window.onload = async function() {
            try {
                const resM = await fetch('members.json'); listMembers = await resM.json();
                const resJ = await fetch('jadwal.json'); listJadwal = await resJ.json();
            } catch(e) { showNotif("Gagal", "Gagal memuat data konfigurasi sistem.", "error"); }

            // MATIKAN SHORTCUT KEYBOARD UNTUK COPY PASTE & INSPECT ELEMENT
            document.addEventListener("keydown", function(e) {
                if (document.getElementById('ujian-section').style.display === 'block') {
                    if (
                        (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'a' || e.key === 'x' || e.key === 'p' || e.key === 'u')) ||
                        e.key === 'F12' || 
                        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))
                    ) {
                        e.preventDefault();
                        showNotif("🚫 DILINDUNGI", "Fungsi salin-tempel dan pintasan tombol dimatikan selama ujian!", "warning");
                    }
                }
            });

            // DETEKSI KECURANGAN PINDAH TAB / MINIMIZE BROWSER (MAKSIMAL 3X)
            document.addEventListener("visibilitychange", function() {
                if (document.hidden && document.getElementById('ujian-section').style.display === 'block') {
                    tabSwitchCount++;
                    if (tabSwitchCount < MAX_TAB_SWITCH) {
                        showNotif(
                            "⚠️ PERINGATAN KECURANGAN", 
                            `Anda terdeteksi berpindah tab atau keluar aplikasi ujian!<br>Peringatan ke-<strong>${tabSwitchCount}</strong> dari ${MAX_TAB_SWITCH}.<br><span style="color:red; font-size:0.85rem;">Pada pelanggaran ke-3, ujian akan DITUTUP PAKSA.</span>`, 
                            "warning"
                        );
                    } else {
                        showNotif(
                            "❌ UJIAN DITUTUP PAKSA", 
                            "Anda telah melakukan pelanggaran keluar aplikasi/pindah tab sebanyak <strong>3 kali</strong>.<br>Sistem menutup ujian dan langsung mengirimkan jawaban Anda.", 
                            "error", 
                            function() {
                                kirimJawabanKeServer(true);
                            }
                        );
                    }
                }
            });
        };

        function showNotif(title, msg, type = "info", onOk = null) {
            document.getElementById('notif-title').textContent = title;
            document.getElementById('notif-message').innerHTML = msg;
            
            const iconMap = { success: "✅", warning: "⚠️", error: "❌", info: "ℹ️" };
            document.getElementById('notif-icon').textContent = iconMap[type] || "ℹ️";
            
            const btnOk = document.getElementById('notif-btn-ok');
            btnOk.onclick = function() {
                document.getElementById('modal-notif').style.display = 'none';
                if (onOk) onOk();
            };
            
            document.getElementById('modal-notif').style.display = 'flex';
        }

        async function prosesLoginSiswa() {
            const nis = document.getElementById('input-nis').value.trim();
            const token = document.getElementById('input-token').value.trim().toUpperCase();

            const siswa = listMembers.find(m => m.id === nis && m.role === 'siswa');
            if (!siswa) return showNotif("Login Gagal", "Nomor Induk Siswa (NIS) tidak terdaftar di sistem!", "warning");

            const jadwal = listJadwal.find(j => j.token.toUpperCase() === token);
            if (!jadwal) return showNotif("Login Gagal", "Token ujian tidak valid atau salah!", "warning");

            // VALIDASI WAKTU BUKA & TUTUP JADWAL
            if (jadwal.waktu_buka && jadwal.waktu_tutup) {
                const now = new Date();
                const waktuBuka = new Date(jadwal.waktu_buka.replace(' ', 'T'));
                const waktuTutup = new Date(jadwal.waktu_tutup.replace(' ', 'T'));

                if (now < waktuBuka) {
                    return showNotif("Ujian Belum Dibuka", `Ujian mata pelajaran <strong>${jadwal.mapel}</strong> belum dapat diakses.<br>Waktu pembukaan: <strong>${jadwal.waktu_buka}</strong>`, "warning");
                }
                if (now > waktuTutup) {
                    return showNotif("Ujian Telah Berakhir", `Masa ujian mata pelajaran <strong>${jadwal.mapel}</strong> sudah ditutup.<br>Batas akhir: <strong>${jadwal.waktu_tutup}</strong>`, "error");
                }
            }

            currentSiswa = siswa;
            currentJadwal = jadwal;
            tabSwitchCount = 0; // Reset hitungan pindah tab

            // Muat soal
            try {
                const resSoal = await fetch(jadwal.file_soal);
                activeSoal = await resSoal.json();
            } catch(e) {
                return showNotif("Gagal", "Gagal memuat berkas naskah soal ujian.", "error");
            }

            document.getElementById('login-section').style.display = 'none';
            document.getElementById('ujian-section').style.display = 'block';
            document.getElementById('info-nama-siswa').textContent = siswa.nama;
            document.getElementById('info-nis-siswa').textContent = siswa.id;
            document.getElementById('info-mapel-ujian').textContent = jadwal.mapel;

            renderSoalUjian();
            mulaiTimerUjian((jadwal.durasi_menit || 90) * 60);
        }

        function renderSoalUjian() {
            let html = '';
            activeSoal.forEach((s) => {
                html += `<div class="soal-card">`;
                html += `<div class="soal-teks">Soal No. ${s.id} (${s.tipe})<br><span style="font-weight:normal; font-size:1rem;">${s.soal}</span></div>`;

                if (s.tipe === "PG" && s.pilihan) {
                    s.pilihan.forEach(p => {
                        html += `
                            <label class="pilihan-item">
                                <input type="radio" name="soal_${s.id}" value="${p.charAt(0)}" onclick="simpanJawaban(${s.id}, '${p.charAt(0)}')">
                                ${p}
                            </label>
                        `;
                    });
                } else if (s.tipe === "ISIAN" || s.tipe === "URAIAN") {
                    html += `<input type="text" class="form-control" placeholder="Tulis jawaban Anda di sini..." oninput="simpanJawaban(${s.id}, this.value)">`;
                }

                html += `</div>`;
            });
            document.getElementById('container-soal').innerHTML = html;
        }

        function simpanJawaban(idSoal, val) {
            jawabanSiswa[idSoal] = val;
        }

        function mulaiTimerUjian(durasiDetik) {
            sisaDetik = durasiDetik;
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (sisaDetik <= 0) {
                    clearInterval(timerInterval);
                    showNotif("Waktu Habis", "Waktu ujian Anda telah selesai. Sistem akan mengirimkan jawaban otomatis.", "warning", function() {
                        kirimJawabanKeServer(true);
                    });
                    return;
                }
                sisaDetik--;
                let jam = Math.floor(sisaDetik / 3600);
                let menit = Math.floor((sisaDetik % 3600) / 60);
                let detik = sisaDetik % 60;
                document.getElementById('timer-countdown').textContent = 
                    String(jam).padStart(2,'0') + ":" + String(menit).padStart(2,'0') + ":" + String(detik).padStart(2,'0');
            }, 1000);
        }

        function konfirmasiKeluarTanpaSimpan() {
            showNotif(
                "Konfirmasi Keluar", 
                "Apakah Anda yakin ingin keluar dari ruang ujian?<br><span style='color:red; font-size:0.85rem;'>Jawaban Anda TIDAK AKAN disimpan ke server.</span>", 
                "warning", 
                function() {
                    if (timerInterval) clearInterval(timerInterval);
                    jawabanSiswa = {};
                    location.reload(); // Keluar dan reload ke halaman login tanpa kirim data
                }
            );

            // Tambahkan tombol Batal di modal
            const modalCard = document.querySelector('#modal-notif .modal-card');
            if (!document.getElementById('btn-batal-keluar')) {
                const btnBatal = document.createElement('button');
                btnBatal.id = 'btn-batal-keluar';
                btnBatal.className = 'btn btn-secondary';
                btnBatal.style.width = '100%';
                btnBatal.style.marginTop = '0.5rem';
                btnBatal.textContent = 'BATAL / KEMBALI MENGARJAKAN';
                btnBatal.onclick = function() {
                    document.getElementById('modal-notif').style.display = 'none';
                    btnBatal.remove();
                };
                modalCard.appendChild(btnBatal);
            }
        }

        function konfirmasiSelesai() {
            showNotif("Konfirmasi Selesai", "Apakah Anda yakin ingin menyelesaikan ujian dan mengirimkan jawaban?", "warning", function() {
                kirimJawabanKeServer(false);
            });

            const modalCard = document.querySelector('#modal-notif .modal-card');
            if (!document.getElementById('btn-batal-selesai')) {
                const btnBatal = document.createElement('button');
                btnBatal.id = 'btn-batal-selesai';
                btnBatal.className = 'btn btn-secondary';
                btnBatal.style.width = '100%';
                btnBatal.style.marginTop = '0.5rem';
                btnBatal.textContent = 'BATAL / LANJUTKAN UJIAN';
                btnBatal.onclick = function() {
                    document.getElementById('modal-notif').style.display = 'none';
                    btnBatal.remove();
                };
                modalCard.appendChild(btnBatal);
            }
        }

        async function kirimJawabanKeServer(isOtomatis = false) {
            if (timerInterval) clearInterval(timerInterval);

            // Hitung nilai PG otomatis
            let skorPG = 0;
            activeSoal.forEach(s => {
                let ans = jawabanSiswa[s.id];
                if (s.tipe === "PG" && ans !== undefined) {
                    if (String(ans).trim().toUpperCase() === String(s.kunci).trim().toUpperCase()) {
                        skorPG += (s.bobot || 1);
                    }
                }
            });

            const sheetName = "HASIL_" + currentJadwal.mapel.toUpperCase().replace(/[^A-Z0-9_]/g, "_");
            const payload = {
                action: "simpanHasil",
                sheetName: sheetName,
                nis: currentSiswa.id,
                nama: currentSiswa.nama,
                kelas: currentSiswa.kelas || currentJadwal.kelas || "6",
                mapel: currentJadwal.mapel,
                skorPG: skorPG,
                jawabanJson: JSON.stringify(jawabanSiswa),
                nilaiEssay: 0,
                totalNilai: skorPG,
                catatan: isOtomatis ? `Selesai otomatis (${tabSwitchCount >= MAX_TAB_SWITCH ? 'Pelanggaran 3x pindah tab' : 'Waktu habis'})` : "Selesai normal"
            };

            showNotif("Mengirim Data", "Menyimpan jawaban ujian ke server pusat...", "info");

            try {
                await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                showNotif("Ujian Selesai", "Jawaban Anda berhasil dikirim ke server. Terima kasih!", "success", function() {
                    location.reload();
                });
            } catch(e) {
                showNotif("Gagal", "Gagal mengirim jawaban ke server. Periksa koneksi internet.", "error");
            }
        }
    </script>
</body>
</html>
