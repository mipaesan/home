<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal CBT - MI Salafiyatul Ma'muroh</title>
    <style>
        :root {
            --primary: #0f5132;
            --primary-light: #198754;
            --accent: #ffc107;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #dee2e6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 30px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.2rem;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Container & Layout Grid */
        .container {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Card Component */
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1.25rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: #495057;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-light);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.7rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-light);
        }

        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-warning {
            background-color: #ffc107;
            color: #212529;
        }

        /* Navigasi Soal Grid */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .nav-btn {
            padding: 0.5rem 0;
            background: #e9ecef;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .nav-btn.answered {
            background: #d1e7dd;
            color: #0f5132;
            border-color: #badbcc;
        }

        /* Lembar Ujian / Soal */
        .soal-container {
            display: none;
        }

        .soal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e9ecef;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .timer {
            color: #dc3545;
            font-size: 1.1rem;
        }

        .soal-text {
            font-size: 1.05rem;
            margin-bottom: 1.2rem;
            line-height: 1.6;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .option-item:hover {
            background-color: #f8f9fa;
        }

        .option-item input {
            margin-top: 0.2rem;
            margin-right: 0.8rem;
        }

        .essay-input {
            width: 100%;
            height: 120px;
            padding: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
        }

        /* Modal Mobile & Alert Custom */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-card {
            background: white;
            border-radius: 8px;
            max-width: 450px;
            width: 100%;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal-footer {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.2rem;
        }

        /* Floating Nav Button for Mobile */
        .btn-float-nav {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 0.8rem 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: 600;
            z-index: 900;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .btn-float-nav {
                display: block;
            }
            .sidebar-nav {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>CBT MI SALAFIYATUL MA'MUROH</h1>
        <p>Sistem Ujian Berbasis Komputer & HP</p>
    </header>

    <div class="container">
        <!-- FORM LOGIN / MASUK UJIAN (KEMBALI HANYA ID & TOKEN) -->
        <div id="login-section" class="card" style="max-width: 420px; margin: 2.5rem auto;">
            <div class="card-title">Login Ujian Siswa</div>
            <form id="form-login" onsubmit="event.preventDefault(); prosesLogin();">
                <div class="form-group">
                    <label for="input-nis">ID / NIS Siswa</label>
                    <input type="text" id="input-nis" class="form-control" placeholder="Contoh: 6-001" required>
                </div>
                <div class="form-group">
                    <label for="input-token">Token Ujian (6 Digit)</label>
                    <input type="text" id="input-token" class="form-control" placeholder="Masukkan 6 Digit Token" maxlength="6" style="text-transform:uppercase" required>
                </div>
                <button type="submit" class="btn">MULAI UJIAN</button>
            </form>
        </div>

        <!-- AREA LEMBAR UJIAN -->
        <div id="exam-section" class="soal-container">
            <div class="main-layout">
                <!-- SIDEBAR NAVIGASI (DESKTOP) -->
                <div class="sidebar-nav">
                    <div class="card">
                        <div class="card-title">Profil Siswa</div>
                        <p style="font-size:0.9rem;"><strong>Nama:</strong> <span id="user-nama">-</span></p>
                        <p style="font-size:0.9rem;"><strong>ID/NIS:</strong> <span id="user-nis">-</span></p>
                        <p style="font-size:0.9rem;"><strong>Mapel:</strong> <span id="user-mapel">-</span></p>
                    </div>

                    <div class="card">
                        <div class="card-title">Navigasi Soal</div>
                        <div class="nav-grid" id="desktop-nav-grid">
                            <!-- Tombol nomor soal di-generate otomatis oleh JS -->
                        </div>
                        <div style="margin-top: 1.5rem;">
                            <button class="btn btn-warning" onclick="konfirmasiSelesai()">SELESAI & SUBMIT</button>
                        </div>
                    </div>
                </div>

                <!-- UTAMA: SOAL & PILIHAN JAWABAN -->
                <div>
                    <div class="soal-header card" style="margin-bottom:1rem;">
                        <div>Soal No. <span id="no-soal-aktif">1</span> / <span id="total-soal">50</span></div>
                        <div class="timer">⏱️ Sisa Waktu: <span id="timer-text">90:00</span></div>
                    </div>

                    <div class="card">
                        <div id="soal-content" class="soal-text">
                            Loading naskah soal...
                        </div>

                        <div id="jawaban-container">
                            <!-- Pilihan Ganda / Input Isian di-generate oleh JS -->
                        </div>

                        <div style="display:flex; justify-content:space-between; margin-top:2rem; gap:1rem;">
                            <button id="btn-prev" class="btn btn-secondary" onclick="soalSebelumnya()" style="width:auto; padding:0.6rem 1.2rem;">◀ Sebelumnya</button>
                            <button id="btn-next" class="btn" onclick="soalBerikutnya()" style="width:auto; padding:0.6rem 1.2rem; margin-left:auto;">Berikutnya ▶</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING BUTTON FOR MOBILE NAV -->
    <button class="btn-float-nav" onclick="bukaModalNav()">📋 Nomor Soal</button>

    <!-- MODAL NAVIGASI MOBILE -->
    <div id="modal-nav" class="modal-overlay">
        <div class="modal-card">
            <div class="card-title">
                <span>Daftar Soal</span>
                <button style="border:none; background:none; font-size:1.2rem; cursor:pointer;" onclick="tutupModalNav()">✕</button>
            </div>
            <div class="nav-grid" id="mobile-nav-grid" style="max-height: 250px;"></div>
            <div class="modal-footer">
                <button class="btn btn-warning" onclick="tutupModalNav(); konfirmasiSelesai();">SELESAI UJIAN</button>
            </div>
        </div>
    </div>

    <!-- MODAL KONFIRMASI / ALERT CUSTOM -->
    <div id="modal-alert" class="modal-overlay">
        <div class="modal-card">
            <div class="card-title" id="modal-alert-title">Informasi</div>
            <p id="modal-alert-msg" style="font-size:0.95rem; margin:1rem 0;"></p>
            <div class="modal-footer" id="modal-alert-footer">
                <button class="btn" onclick="tutupAlert()">OK</button>
            </div>
        </div>
    </div>

    <script>
        let listMembers = [];
        let listJadwal = [];
        let currentSiswa = null;
        let currentMapel = null;
        let soalData = [];
        let indexSoal = 0;
        let jawabanSiswa = {};
        let timerInterval = null;

        window.onload = function() {
            loadInitialData();
        };

        async function loadInitialData() {
            try {
                const resMembers = await fetch('members.json');
                listMembers = await resMembers.json();

                const resJadwal = await fetch('jadwal.json');
                listJadwal = await resJadwal.json();
            } catch (err) {
                showAlert("Gagal Memuat Data", "Gagal mengambil data jadwal atau members.");
            }
        }

        // OTOMATIS MENGENALI MAPEL DARI TOKEN YANG DIKETIK
        function prosesLogin() {
            const nisInput = document.getElementById('input-nis').value.trim();
            const tokenInput = document.getElementById('input-token').value.trim().toUpperCase();

            // 1. Cek Siswa
            const siswa = listMembers.find(m => m.id === nisInput && m.role === 'siswa');
            if (!siswa) {
                showAlert("Login Gagal", "ID / NIS Siswa tidak terdaftar!");
                return;
            }

            // 2. Cek Token di Jadwal (Cari Mapel Otomatis)
            const mapelDipilih = listJadwal.find(j => j.token === tokenInput);
            if (!mapelDipilih) {
                showAlert("Token Salah", "Token Ujian tidak ditemukan atau salah!");
                return;
            }

            // 3. Validasi Aktif
            if (!mapelDipilih.aktif) {
                showAlert("Ujian Ditutup", "Mata pelajaran ini sedang tidak diaktifkan.");
                return;
            }

            // 4. Validasi Jadwal Waktu
            const sekarang = new Date();
            const waktuBuka = new Date(mapelDipilih.waktu_buka.replace(' ', 'T'));
            const waktuTutup = new Date(mapelDipilih.waktu_tutup.replace(' ', 'T'));

            if (sekarang < waktuBuka) {
                showAlert("Ujian Belum Dibuka", `Ujian <strong>${mapelDipilih.mapel}</strong> belum dibuka.<br><br>🗓️ Jadwal Buka: <strong>${mapelDipilih.waktu_buka} WIB</strong>`);
                return;
            }

            if (sekarang > waktuTutup) {
                showAlert("Ujian Selesai", `Waktu ujian untuk <strong>${mapelDipilih.mapel}</strong> telah berakhir.<br><br>⏱️ Berakhir Pada: <strong>${mapelDipilih.waktu_tutup} WIB</strong>`);
                return;
            }

            currentSiswa = siswa;
            currentMapel = mapelDipilih;
            loadSoal(mapelDipilih.file_soal, mapelDipilih.durasi_menit);
        }

        async function loadSoal(filePath, durasi) {
            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error("File soal tidak ditemukan");
                
                soalData = await res.json();

                document.getElementById('login-section').style.display = 'none';
                document.getElementById('exam-section').style.display = 'block';

                document.getElementById('user-nama').textContent = currentSiswa.nama;
                document.getElementById('user-nis').textContent = currentSiswa.id;
                document.getElementById('user-mapel').textContent = currentMapel.mapel;
                document.getElementById('total-soal').textContent = soalData.length;

                renderNavGrid();
                tampilSoal(0);
                startTimer(durasi * 60);

            } catch (err) {
                showAlert("Error", "File naskah soal belum siap atau belum diunggah.");
            }
        }

        function tampilSoal(idx) {
            indexSoal = idx;
            document.getElementById('no-soal-aktif').textContent = idx + 1;
            
            const item = soalData[idx];
            document.getElementById('soal-content').innerHTML = item.soal;

            const container = document.getElementById('jawaban-container');
            container.innerHTML = '';

            if (item.tipe === "PG") {
                let html = '<ul class="options-list">';
                item.pilihan.forEach((pil, pIdx) => {
                    const letter = String.fromCharCode(65 + pIdx);
                    const checked = (jawabanSiswa[item.id] === letter) ? 'checked' : '';
                    html += `
                        <li class="option-item" onclick="pilihJawabanPG('${item.id}', '${letter}')">
                            <input type="radio" name="opt_${item.id}" ${checked}>
                            <div><strong>${letter}.</strong> ${pil}</div>
                        </li>
                    `;
                });
                html += '</ul>';
                container.innerHTML = html;

            } else if (item.tipe === "ISIAN" || item.tipe === "URAIAN") {
                const val = jawabanSiswa[item.id] || '';
                container.innerHTML = `
                    <textarea class="essay-input" placeholder="Tuliskan jawaban Anda di sini..." oninput="simpanJawabanTeks('${item.id}', this.value)">${val}</textarea>
                `;
            }

            updateNavActiveState();
        }

        function pilihJawabanPG(soalId, opsi) {
            jawabanSiswa[soalId] = opsi;
            tampilSoal(indexSoal);
        }

        function simpanJawabanTeks(soalId, val) {
            jawabanSiswa[soalId] = val;
            updateNavActiveState();
        }

        function soalBerikutnya() {
            if (indexSoal < soalData.length - 1) tampilSoal(indexSoal + 1);
        }

        function soalSebelumnya() {
            if (indexSoal > 0) tampilSoal(indexSoal - 1);
        }

        function renderNavGrid() {
            const deskGrid = document.getElementById('desktop-nav-grid');
            const mobGrid = document.getElementById('mobile-nav-grid');
            deskGrid.innerHTML = '';
            mobGrid.innerHTML = '';

            soalData.forEach((s, idx) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.id
