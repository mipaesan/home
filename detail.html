<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detail Berita - MI Salafiyatul Ma'muroh Paesan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --primary:#0f5132; --primary-light:#198754; --bg:#FFFBF5; --card:#ffffff; --muted:#6b7280; --border:#f0f0f0; }
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}
body{background:var(--bg);color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--primary);font-size:1.05rem;text-decoration:none}
.logo img{width:36px;height:36px;object-fit:contain;border-radius:6px}
.nav-links a{margin-left:18px;text-decoration:none;color:#1a1a1a;font-weight:600;font-size:.85rem}
.nav-links a.cbt{ background:var(--primary);color:white;padding:8px 14px;border-radius:8px; border:1px solid var(--primary)}
.container{max-width:800px;margin:24px auto;padding:0 5%;flex:1;width:100%}
.back-btn{display:inline-block;margin-bottom:18px;padding:9px 16px;background:white;border:1px solid var(--border);color:var(--primary);text-decoration:none;border-radius:10px;font-weight:700;font-size:.85rem;transition:.2s}
.back-btn:hover{border-color:var(--primary);transform:translateY(-2px)}
.berita-card{background:white;border-radius:18px;overflow:hidden;border:1px solid var(--border);box-shadow:0 8px 20px rgba(0,0,0,.06)}
.berita-card img.main-img{width:100%;max-height:420px;object-fit:cover;display:block}
.berita-content{padding:22px}
.berita-content h1{font-size:1.6rem;font-weight:800;color:var(--primary);line-height:1.3;margin-bottom:8px}
.tanggal{color:var(--muted);font-size:.85rem;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.tanggal span{background:#e0ffe0;color:var(--primary);padding:3px 10px;border-radius:20px;font-weight:700;font-size:.75rem;border:1px solid #c8f7c5}
.isi-berita p{line-height:1.8;margin-bottom:14px;color:#333;font-size:.92rem}
footer{background:#111;color:#aaa;text-align:center;padding:26px;font-size:.85rem;margin-top:20px;line-height:1.6}
@media(max-width:600px){.berita-content h1{font-size:1.3rem}.nav-links{display:none}}
</style>
</head>
<body>
<nav><a class="logo" href="index.html"><img src="logo-mi.png" alt="Logo MI"> MI Salafiyatul Ma'muroh Paesan</a><div class="nav-links"><a href="index.html#berita">Berita</a><a href="index.html#layanan">Layanan</a><a class="cbt" href="cbt/index.html">Ujian Online</a></div></nav>

<div class="container">
<a href="index.html#berita" class="back-btn">← Kembali ke Beranda</a>
<div class="berita-card" id="berita-detail"><div style="padding:40px;text-align:center;color:var(--muted)">Memuat berita...</div></div>
</div>

<footer><p>&copy; 2025 MI Salafiyatul Ma'muroh Paesan | Jelok, Cepogo</p><p>085725311612 | 081567681930 | mipaesan@gmail.com</p></footer>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
fetch('berita.json').then(res=>res.json()).then(data=>{
  const berita = data.find(b=> String(b.id) === String(id) || String(b.slug) === String(id));
  const container=document.getElementById('berita-detail');
  if(!berita){
    container.innerHTML='<div style="padding:30px;text-align:center"><p>Berita tidak ditemukan.</p><a href="index.html#berita" class="back-btn" style="margin-top:16px">← Kembali</a></div>';
    return;
  }
  document.title = berita.judul + ' - MI Salafiyatul Ma\'muroh';
  const isiParagraf = (berita.isi||berita.ringkasan||'').split('\n\n').map(p=>`<p>${p.trim()}</p>`).join('');
  container.innerHTML=`
    <img class="main-img" src="${berita.gambar}" alt="${berita.judul}">
    <div class="berita-content">
      <h1>${berita.judul}</h1>
      <div class="tanggal">📅 ${berita.tanggal} <span>${berita.kategori||'Berita Madrasah'}</span></div>
      <div class="isi-berita">${isiParagraf}</div>
      <a href="index.html#berita" class="back-btn" style="margin-top:20px">← Kembali ke Daftar Berita</a>
    </div>
  `;
}).catch(()=>{
  document.getElementById('berita-detail').innerHTML='<div style="padding:30px;text-align:center">Gagal memuat berita.<br><a href="index.html#berita" class="back-btn" style="margin-top:16px">← Kembali</a></div>';
});
</script>
</body>
</html>
