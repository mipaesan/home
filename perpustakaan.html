<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Digital</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #2c3e50;
            margin-bottom: 8px;
        }

        /* Filter Kategori */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            background-color: #fff;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #475569;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }

        /* Grid Buku */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .book-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .book-card:hover {
            transform: translateY(-5px);
        }

        .book-cover {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        .book-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .book-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .book-author {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 12px;
        }

        .book-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
        }

        .view-count {
            font-size: 0.85rem;
            font-weight: 600;
            color: #0284c7;
            background-color: #e0f2fe;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-read {
            background-color: #16a34a;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-read:hover {
            background-color: #15803d;
        }

        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Perpustakaan Digital</h1>
        <p>Pilih dan baca buku favoritmu online</p>
    </header>

    <!-- Filter Kategori -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterBuku('semua', this)">Semua</button>
        <button class="filter-btn" onclick="filterBuku('cergam', this)">Cergam</button>
        <button class="filter-btn" onclick="filterBuku('kelas1', this)">Kelas 1</button>
        <button class="filter-btn" onclick="filterBuku('kelas2', this)">Kelas 2</button>
    </div>

    <!-- Container Daftar Buku -->
    <div class="book-grid" id="bookGrid">
        <div class="loading">Memuat daftar buku...</div>
    </div>

    <script>
        // URL Apps Script milik Mas Kholil
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5jf0YBUogzpPMlR8WVNkBjJZ9MEGJeILXSa5aM5hgmWS7yoAxhCkKBv5qYw4PjnNa/exec";
        
        let daftarBuku = [];
        let rekapDibaca = {};

        // 1. Ambil data buku & data rekap dibaca dari Google Sheet
        async function muatData() {
            try {
                // Ambil data buku dari file buku.json
                const resBuku = await fetch('buku.json');
                daftarBuku = await resBuku.json();

                // Ambil data statistik dari Apps Script Google Sheet
                const resCounts = await fetch(SCRIPT_URL);
                rekapDibaca = await resCounts.json();

            } catch (err) {
                console.error("Gagal memuat statistik, menampilkan data buku saja:", err);
            } finally {
                tampilkanBuku(daftarBuku);
            }
        }

        // 2. Fungsi Menampilkan Buku ke Layar
        function tampilkanBuku(bukuArray) {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            if (bukuArray.length === 0) {
                grid.innerHTML = '<div class="loading">Tidak ada buku dalam kategori ini.</div>';
                return;
            }

            bukuArray.forEach(buku => {
                // Ambil jumlah dibaca dari Google Sheet (default 0 jika belum pernah dibaca)
                const jumlahDibaca = rekapDibaca[buku.judul] || 0;

                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <img src="${buku.cover}" alt="${buku.judul}" class="book-cover">
                    <div class="book-info">
                        <div class="book-title">${buku.judul}</div>
                        <div class="book-author">${buku.penulis || 'Anonim'}</div>
                        <div class="book-meta">
                            <span class="view-count">👁️ ${jumlahDibaca}</span>
                            <a href="${buku.link}" target="_blank" class="btn-read" onclick="catatPembaca('${buku.judul}', '${buku.kategori}')">Baca Buku</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 3. Fungsi Catat Pembaca ke Google Sheet saat tombol "Baca Buku" diklik
        function catatPembaca(judul, kategori) {
            // Kirim data ke Google Sheets secara background
            const url = `${SCRIPT_URL}?judul=${encodeURIComponent(judul)}&kategori=${encodeURIComponent(kategori)}`;
            
            fetch(url, { method: 'POST', mode: 'no-cors' })
                .then(() => console.log('Tercatat di Google Sheet!'))
                .catch(err => console.error('Gagal mencatat:', err));
        }

        // 4. Fungsi Filter berdasarkan Kategori
        function filterBuku(kategori, btn) {
            // Ubah tampilan tombol aktif
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (kategori === 'semua') {
                tampilkanBuku(daftarBuku);
            } else {
                const hasilFilter = daftarBuku.filter(b => b.kategori === kategori);
                tampilkanBuku(hasilFilter);
            }
        }

        // Jalankan fungsi saat halaman pertama dibuka
        muatData();
    </script>
</body>
</html>
