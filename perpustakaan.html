<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Digital - MI Salafiyatul Ma'muroh</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    header h1 {
      color: #d97706;
      font-size: 32px;
      margin-bottom: 8px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
    }
    header p {
      color: #064e3b;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    
    /* Area Filter & Pencarian */
    .filter-section {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .search-bar {
      width: 100%;
      max-width: 500px;
    }
    .search-bar input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus {
      border-color: #075e54;
    }
    
    /* Tombol Kategori Filter */
    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .btn-filter {
      background-color: #fff;
      border: 1px solid #075e54;
      color: #075e54;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-filter:hover, .btn-filter.active {
      background-color: #075e54;
      color: #fff;
    }

    /* Grid Kartu Buku */
    .grid-buku {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .card-buku {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card-buku:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }
    .cover-buku {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background-color: #eee;
    }
    .info-buku {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .judul-buku {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .penulis-buku {
      font-size: 12px;
      color: #777;
      margin-bottom: 12px;
    }
    .kategori-tag {
      display: inline-block;
      font-size: 11px;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      align-self: flex-start;
      text-transform: capitalize;
    }
    .btn-baca {
      margin-top: auto;
      display: block;
      text-align: center;
      background-color: #075e54;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn-baca:hover {
      background-color: #128c7e;
    }
    .pesan-kosong {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: #888;
    }

    /* Styles Pop-up Reader PDF */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .modal-container {
      background: #fff;
      width: 100%;
      max-width: 900px;
      height: 92vh;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .modal-header {
      background-color: #075e54;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      padding: 0 5px;
    }
    .modal-body {
      flex: 1;
      background: #fff;
      -webkit-overflow-scrolling: touch;
    }
    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Perpustakaan Digital</h1>
      <p>Koleksi Buku Bacaan &amp; Pembelajaran MI Salafiyatul Ma'muroh</p>
    </header>

    <div class="filter-section">
      <!-- Input Pencarian Teks -->
      <div class="search-bar">
        <input type="text" id="inputCari" placeholder="Cari judul buku atau penulis..." onkeyup="filterSemua()">
      </div>

      <!-- Tombol Filter Kategori -->
      <div class="category-buttons" id="areaFilter">
        <button class="btn-filter active" onclick="pilihKategori('Semua Buku', this)">Semua Buku</button>
        <button class="btn-filter" onclick="pilihKategori('Kelas 1', this)">Kelas 1</button>
        <button class="btn-filter" onclick="pilihKategori('Kelas 2', this)">Kelas 2</button>
        <button class="btn-filter" onclick="pilihKategori('Kelas 3', this)">Kelas 3</button>
        <button class="btn-filter" onclick="pilihKategori('Kelas 4', this)">Kelas 4</button>
        <button class="btn-filter" onclick="pilihKategori('Kelas 5', this)">Kelas 5</button>
        <button class="btn-filter" onclick="pilihKategori('Kelas 6', this)">Kelas 6</button>
        <button class="btn-filter" onclick="pilihKategori('Cerita', this)">Cerita</button>
      </div>
    </div>

    <div class="grid-buku" id="daftarBuku">
      <div class="pesan-kosong">Memuat koleksi buku...</div>
    </div>
  </div>

  <!-- Pop-Up Reader -->
  <div class="modal-overlay" id="modalBaca">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title" id="modalJudul">Membaca Buku</div>
        <button class="btn-close" onclick="tutupModal()">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="iframePdf" src="" allow="autoplay"></iframe>
      </div>
    </div>
  </div>

  <script>
    let semuaBuku = [];
    let kategoriAktif = 'Semua Buku';

    // Algoritma Pengacak Urutan Buku
    function acakBuku(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Ambil Data dari buku.json
    fetch('buku.json')
      .then(response => {
        if (!response.ok) throw new Error('Gagal memuat buku.json');
        return response.json();
      })
      .then(data => {
        semuaBuku = acakBuku(data);
        tampilkanBuku(semuaBuku);
      })
      .catch(error => {
        console.error(error);
        document.getElementById('daftarBuku').innerHTML = '<div class="pesan-kosong">Gagal memuat data buku. Pastikan file buku.json tersedia.</div>';
      });

    // Tampilkan Kartu Buku ke Grid
    function tampilkanBuku(listBuku) {
      const container = document.getElementById('daftarBuku');
      
      if (listBuku.length === 0) {
        container.innerHTML = '<div class="pesan-kosong">Buku tidak ditemukan.</div>';
        return;
      }

      let html = '';
      listBuku.forEach(buku => {
        let katLabel = buku.kategori || '';
        let linkBuku = buku.file || buku.link || buku.url || buku.pdf || '';
        
        let judulAman = (buku.judul || '').replace(/'/g, "\\'");
        let linkAman = linkBuku.replace(/'/g, "\\'");

        html += `
          <div class="card-buku">
            <img class="cover-buku" src="${buku.cover || 'https://via.placeholder.com/200x260?text=No+Cover'}" alt="${buku.judul}">
            <div class="info-buku">
              ${katLabel ? `<span class="kategori-tag">${katLabel}</span>` : ''}
              <div class="judul-buku">${buku.judul}</div>
              <div class="penulis-buku">${buku.penulis || 'Penulis tidak diketahui'}</div>
              <button class="btn-baca" onclick="bukaModal('${linkAman}', '${judulAman}')">Baca Buku</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Fungsi Buka Pop-Up (Optimasi untuk HP)
    function bukaModal(url, judul) {
      const modal = document.getElementById('modalBaca');
      const iframe = document.getElementById('iframePdf');
      const modalJudul = document.getElementById('modalJudul');

      modalJudul.innerText = judul;
      
      if (!url.includes('drive.google.com')) {
        // Konversi path relatif ke URL absolut untuk Google Docs Viewer
        const loc = window.location;
        const baseUrl = loc.protocol + '//' + loc.host + loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
        const fullUrl = url.startsWith('http') ? url : baseUrl + url;
        
        iframe.src = 'https://docs.google.com/viewer?url=' + encodeURIComponent(fullUrl) + '&embedded=true';
      } else {
        iframe.src = url;
      }

      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    // Fungsi Tutup Pop-Up
    function tutupModal() {
      const modal = document.getElementById('modalBaca');
      const iframe = document.getElementById('iframePdf');

      modal.style.display = 'none';
      iframe.src = '';
      document.body.style.overflow = 'auto';
    }

    // Tutup Pop-Up saat area luar diklik
    window.onclick = function(event) {
      const modal = document.getElementById('modalBaca');
      if (event.target === modal) {
        tutupModal();
      }
    }

    // Fungsi Pilih Kategori Filter
    function pilihKategori(kategori, el) {
      kategoriAktif = kategori;
      
      document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');

      filterSemua();
    }

    // Kombinasi Filter Kategori & Pencarian
    function filterSemua() {
      const kataKunci = document.getElementById('inputCari').value.toLowerCase().trim();
      const katTargetAbaikanSpasi = kategoriAktif.toLowerCase().replace(/\s+/g, '');

      const hasil = semuaBuku.filter(buku => {
        const cocokJudul = (buku.judul || '').toLowerCase().includes(kataKunci);
        const cocokPenulis = (buku.penulis || '').toLowerCase().includes(kataKunci);
        const cocokTeks = cocokJudul || cocokPenulis;

        let cocokKategori = false;
        if (kategoriAktif === 'Semua Buku') {
          cocokKategori = true;
        } else if (buku.kategori) {
          const katBukuAbaikanSpasi = String(buku.kategori).toLowerCase().replace(/\s+/g, '');
          cocokKategori = katBukuAbaikanSpasi.includes(katTargetAbaikanSpasi);
        }

        return cocokTeks && cocokKategori;
      });

      tampilkanBuku(hasil);
    }
  </script>

</body>
</html>
