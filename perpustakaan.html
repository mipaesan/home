<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Digital MI Salafiyatul Ma'muroh</title>
  <style>
    :root {
      --primary-color: #0d6efd;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
    }

    .controls {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }

    .search-filter {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 280px;
    }

    input[type="text"], select {
      padding: 10px 14px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"] {
      flex: 1;
    }

    button.btn-acak {
      background-color: #198754;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button.btn-acak:hover {
      background-color: #157347;
    }

    .container-buku {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .card-buku {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card-buku:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.12);
    }

    .img-container {
      width: 100%;
      height: 260px;
      background-color: #e9ecef;
      overflow: hidden;
    }

    .card-buku img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 12px 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-body h3 {
      font-size: 1rem;
      margin: 0 0 8px 0;
      line-height: 1.3;
    }

    .kategori-badge {
      display: inline-block;
      font-size: 0.75rem;
      background: #e7f1ff;
      color: var(--primary-color);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      align-self: flex-start;
      font-weight: 600;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f1f1f1;
    }

    .view-count {
      font-size: 0.85rem;
      color: #6c757d;
      font-weight: 500;
    }

    .btn-baca {
      background-color: var(--primary-color);
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-baca:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>
<body>

  <header>
    <h1>Perpustakaan Digital MI Salafiyatul Ma'muroh</h1>
  </header>

  <div class="controls">
    <div class="search-filter">
      <input type="text" id="inputCari" placeholder="Cari judul buku..." oninput="filterBuku()">
      <select id="selectKategori" onchange="filterBuku()">
        <option value="">Semua Kategori</option>
      </select>
    </div>
    <button class="btn-acak" onclick="bukuAcak()">🎲 Rekomendasi Acak</button>
  </div>

  <main class="container-buku" id="containerBuku"></main>

  <script>
    // URL Web App Apps Script milik kamu
    const SCRIPT_URL = "URL_GOOGLE_APPS_SCRIPT_KAMU"; 
    
    let semuaBuku = [];

    // 1. Inisialisasi: Load data buku lokal dari buku.json
    document.addEventListener("DOMContentLoaded", () => {
      fetch('buku.json')
        .then(res => res.json())
        .then(data => {
          semuaBuku = data;
          isiKategoriOption(semuaBuku);
          tampilkanBuku(semuaBuku);
        })
        .catch(err => console.error("Gagal memuat katalog buku:", err));
    });

    // 2. Tampilkan Daftar Buku (Instan & Ringan dengan Lazy Loading)
    function tampilkanBuku(daftar) {
      const container = document.getElementById('containerBuku');
      container.innerHTML = '';

      if (daftar.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Buku tidak ditemukan.</p>';
        return;
      }

      daftar.forEach((buku, idx) => {
        const idBuku = buku.id || `buku-${idx}`;
        const cardHtml = `
          <div class="card-buku">
            <div class="img-container">
              <!-- Loading Lazy agar gambar di-load saat di-scroll -->
              <img src="${buku.cover}" alt="${buku.judul}" loading="lazy" width="100%" height="auto">
            </div>
            <div class="card-body">
              <div>
                <h3>${buku.judul}</h3>
                <span class="kategori-badge">${buku.kategori}</span>
              </div>
              <div class="card-footer">
                <span class="view-count" id="view-${idBuku}">👁️ <small>...</small></span>
                <a href="${buku.link}" target="_blank" onclick="catatDibaca('${buku.judul.replace(/'/g, "\\'")}', '${buku.kategori.replace(/'/g, "\\'")}')" class="btn-baca">Baca Buku</a>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });

      // Panggil statistik views di latar belakang setelah UI selesai digambar
      muatStatistikView(daftar);
    }

    // 3. Ambil Statistik View Counts dari Apps Script secara Asinkron (Latar Belakang)
    async function muatStatistikView(daftar) {
      try {
        const response = await fetch(SCRIPT_URL);
        const dataViews = await response.json();

        daftar.forEach((buku, idx) => {
          const idBuku = buku.id || `buku-${idx}`;
          const elView = document.getElementById(`view-${idBuku}`);
          if (elView) {
            const total = dataViews[buku.judul] || 0;
            elView.innerHTML = `👁️ ${total}`;
          }
        });
      } catch (error) {
        console.error("Gagal memuat statistik view:", error);
        daftar.forEach((buku, idx) => {
          const idBuku = buku.id || `buku-${idx}`;
          const elView = document.getElementById(`view-${idBuku}`);
          if (elView && elView.innerHTML.includes('...')) {
            elView.innerHTML = `👁️ 0`;
          }
        });
      }
    }

    // 4. Catat Riwayat Pembacaan ke Google Sheets via Apps Script
    function catatDibaca(judul, kategori) {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ judul: judul, kategori: kategori })
      }).catch(err => console.error("Gagal mencatat transaksi pembaca:", err));
    }

    // 5. Opsi Filter & Pencarian
    function isiKategoriOption(daftar) {
      const select = document.getElementById('selectKategori');
      const kategoriSet = new Set(daftar.map(b => b.kategori));
      kategoriSet.forEach(kat => {
        const opt = document.createElement('option');
        opt.value = kat;
        opt.textContent = kat;
        select.appendChild(opt);
      });
    }

    function filterBuku() {
      const keyword = document.getElementById('inputCari').value.toLowerCase();
      const kat = document.getElementById('selectKategori').value;

      const hasil = semuaBuku.filter(buku => {
        const cocokJudul = buku.judul.toLowerCase().includes(keyword);
        const cocokKat = kat === "" || buku.kategori === kat;
        return cocokJudul && cocokKat;
      });

      tampilkanBuku(hasil);
    }

    // 6. Rekomendasi Buku Acak
    function bukuAcak() {
      if (semuaBuku.length === 0) return;
      const acak = semuaBuku[Math.floor(Math.random() * semuaBuku.length)];
      tampilkanBuku([acak]);
    }
  </script>
</body>
</html>
