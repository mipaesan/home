<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Digital - MI Salafiyatul Ma'muroh</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    header h1 {
      color: #075e54;
      margin-bottom: 8px;
    }
    header p {
      color: #666;
      font-size: 14px;
    }
    .search-bar {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }
    .search-bar input {
      width: 100%;
      max-width: 500px;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus {
      border-color: #075e54;
    }
    .grid-buku {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .card-buku {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card-buku:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }
    .cover-buku {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background-color: #eee;
    }
    .info-buku {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .judul-buku {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .penulis-buku {
      font-size: 12px;
      color: #777;
      margin-bottom: 12px;
    }
    .btn-baca {
      margin-top: auto;
      display: block;
      text-align: center;
      background-color: #075e54;
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-baca:hover {
      background-color: #128c7e;
    }
    .pesan-kosong {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Perpustakaan Digital</h1>
      <p>Koleksi Buku Bacaan &amp; Pembelajaran MI Salafiyatul Ma'muroh</p>
    </header>

    <div class="search-bar">
      <input type="text" id="inputCari" placeholder="Cari judul buku atau penulis..." onkeyup="cariBuku()">
    </div>

    <div class="grid-buku" id="daftarBuku">
      <div class="pesan-kosong">Memuat koleksi buku...</div>
    </div>
  </div>

  <script>
    let semuaBuku = [];

    // Fungsi untuk mengacak urutan array (Fisher-Yates Shuffle)
    function acakBuku(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Mengambil data dari buku.json
    fetch('buku.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Gagal mengambil data buku.json');
        }
        return response.json();
      })
      .then(data => {
        // 🎲 Mengacak daftar buku setiap kali halaman dibuka
        semuaBuku = acakBuku(data);
        tampilkanBuku(semuaBuku);
      })
      .catch(error => {
        console.error(error);
        document.getElementById('daftarBuku').innerHTML = '<div class="pesan-kosong">Gagal memuat daftar buku. Pastikan file buku.json tersedia.</div>';
      });

    // Menampilkan buku ke elemen HTML
    function tampilkanBuku(listBuku) {
      const container = document.getElementById('daftarBuku');
      
      if (listBuku.length === 0) {
        container.innerHTML = '<div class="pesan-kosong">Buku yang dicari tidak ditemukan.</div>';
        return;
      }

      let html = '';
      listBuku.forEach(buku => {
        html += `
          <div class="card-buku">
            <img class="cover-buku" src="${buku.cover || 'https://via.placeholder.com/200x260?text=No+Cover'}" alt="${buku.judul}">
            <div class="info-buku">
              <div class="judul-buku">${buku.judul}</div>
              <div class="penulis-buku">${buku.penulis || 'Penulis tidak diketahui'}</div>
              <a href="${buku.link || '#'}" target="_blank" class="btn-baca">Baca Buku</a>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Fungsi Pencarian Buku
    function cariBuku() {
      const kataKunci = document.getElementById('inputCari').value.toLowerCase();
      const hasilFilter = semuaBuku.filter(buku => {
        const judul = (buku.judul || '').toLowerCase();
        const penulis = (buku.penulis || '').toLowerCase();
        return judul.includes(kataKunci) || penulis.includes(kataKunci);
      });
      tampilkanBuku(hasilFilter);
    }
  </script>

</body>
</html>
